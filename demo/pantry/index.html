<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">P</span> Pantry</div>
    <div class="cart-pill" aria-label="Items in cart"><span id="badge">0</span> items</div>
  </header>

  <div id="promo" class="promo">
    <b>SAVE10</b> gives 10% off your order. Ends in <span id="promo-time">0:30</span>
  </div>

  <main class="layout">
    <section>
      <input id="search" type="search" placeholder="Search groceries" autocomplete="off">
      <div id="results" class="results" data-query="">
        <h3 id="results-title">Popular right now</h3>
        <ul id="results-list"></ul>
      </div>

      <div id="grid" class="grid"></div>
    </section>

    <aside class="cart">
      <h2>Your cart</h2>
      <ul id="lines" class="lines"><li class="empty">Nothing here yet</li></ul>
      <div class="coupon">
        <input id="coupon" placeholder="Coupon code" autocomplete="off">
        <button id="apply">Apply</button>
      </div>
      <p id="coupon-msg" class="msg"></p>
      <dl class="totals">
        <dt>Subtotal</dt><dd id="subtotal">₹0</dd>
        <dt>Discount</dt><dd id="discount">₹0</dd>
        <dt class="grand">Total</dt><dd id="total" class="grand">₹0</dd>
      </dl>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
