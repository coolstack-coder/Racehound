<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4652"/>
    </marker>
  </defs>

  <!-- simulator -->
  <rect x="24" y="24" width="300" height="422" rx="12" fill="#f4f6f8" stroke="#c9d0d8"/>
  <text x="44" y="56" font-size="17" font-weight="700" fill="#151a21">Simulator</text>
  <text x="44" y="76" font-size="12.5" fill="#5b6572">host page, owns the seed</text>

  <rect x="44" y="96" width="260" height="62" rx="9" fill="#fff" stroke="#c9d0d8"/>
  <text x="58" y="120" font-size="14" font-weight="600" fill="#151a21">1. pick a step from the seed</text>
  <text x="58" y="141" font-size="12.5" fill="#5b6572">click, type, wait, arrive, respond</text>

  <rect x="44" y="172" width="260" height="62" rx="9" fill="#fff" stroke="#c9d0d8"/>
  <text x="58" y="196" font-size="14" font-weight="600" fill="#151a21">2. run it, drain microtasks</text>
  <text x="58" y="217" font-size="12.5" fill="#5b6572">then check "always" invariants</text>

  <rect x="44" y="248" width="260" height="62" rx="9" fill="#fff" stroke="#c9d0d8"/>
  <text x="58" y="272" font-size="14" font-weight="600" fill="#151a21">3. settle and check "eventually"</text>
  <text x="58" y="293" font-size="12.5" fill="#5b6572">deliver the rest, run due timers</text>

  <rect x="44" y="324" width="260" height="104" rx="9" fill="#fff5e6" stroke="#f0b45a"/>
  <text x="58" y="348" font-size="14" font-weight="600" fill="#151a21">4. on failure: shrink</text>
  <text x="58" y="369" font-size="12.5" fill="#5b6572">ddmin over the step list, merge</text>
  <text x="58" y="387" font-size="12.5" fill="#5b6572">waits, binary search each wait.</text>
  <text x="58" y="410" font-size="12.5" fill="#5b6572">150 steps become 3 to 6.</text>

  <!-- iframe -->
  <rect x="380" y="24" width="370" height="422" rx="12" fill="#ffffff" stroke="#151a21" stroke-width="1.5"/>
  <text x="400" y="56" font-size="17" font-weight="700" fill="#151a21">The app, in an iframe</text>
  <text x="400" y="76" font-size="12.5" fill="#5b6572">unchanged code; runtime injected first</text>

  <rect x="400" y="96" width="330" height="236" rx="9" fill="#151a21"/>
  <text x="418" y="122" font-size="13" font-weight="700" fill="#f5a524" font-family="ui-monospace, Menlo, monospace">runtime.js replaces</text>
  <g font-size="12.5" font-family="ui-monospace, Menlo, monospace">
    <text x="418" y="152" fill="#e6e9ee">Date, performance.now</text><text x="612" y="152" fill="#8fb8ff">virtual clock</text>
    <text x="418" y="178" fill="#e6e9ee">setTimeout, setInterval</text><text x="612" y="178" fill="#8fb8ff">timer queue</text>
    <text x="418" y="204" fill="#e6e9ee">requestAnimationFrame</text><text x="612" y="204" fill="#8fb8ff">16 ms timer</text>
    <text x="418" y="230" fill="#e6e9ee">Math.random, crypto</text><text x="612" y="230" fill="#8fb8ff">seeded PRNG</text>
    <text x="418" y="256" fill="#e6e9ee">fetch</text><text x="612" y="256" fill="#8fb8ff">two legs</text>
    <text x="418" y="282" fill="#e6e9ee">localStorage</text><text x="612" y="282" fill="#8fb8ff">in memory</text>
    <text x="418" y="308" fill="#e6e9ee">errors, console.error</text><text x="612" y="308" fill="#8fb8ff">recorded</text>
  </g>

  <rect x="400" y="348" width="330" height="80" rx="9" fill="#f4f6f8" stroke="#c9d0d8"/>
  <text x="418" y="374" font-size="14" font-weight="600" fill="#151a21">App code</text>
  <text x="418" y="395" font-size="12.5" fill="#5b6572">debounces, optimistic updates, countdowns:</text>
  <text x="418" y="413" font-size="12.5" fill="#5b6572">nothing moves unless the simulator says so</text>

  <!-- server -->
  <rect x="800" y="96" width="176" height="236" rx="12" fill="#f4f6f8" stroke="#c9d0d8"/>
  <text x="816" y="124" font-size="16" font-weight="700" fill="#151a21">Fake server</text>
  <text x="816" y="146" font-size="12.5" fill="#5b6572">racehound.config.js</text>
  <text x="816" y="182" font-size="12.5" fill="#3d4652">fresh state per run</text>
  <text x="816" y="204" font-size="12.5" fill="#3d4652">invariants can read it</text>
  <text x="816" y="246" font-size="12.5" fill="#2f6bd8">arrive: request</text>
  <text x="816" y="264" font-size="12.5" fill="#2f6bd8">reaches the server</text>
  <text x="816" y="296" font-size="12.5" fill="#1f9d63">respond: reply</text>
  <text x="816" y="314" font-size="12.5" fill="#1f9d63">reaches the page</text>

  <!-- arrows -->
  <line x1="324" y1="203" x2="396" y2="203" stroke="#3d4652" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="331" y="194" font-size="11.5" fill="#5b6572">drives</text>
  <line x1="730" y1="242" x2="796" y2="242" stroke="#2f6bd8" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="796" y1="292" x2="734" y2="292" stroke="#1f9d63" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
